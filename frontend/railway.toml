[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
# "/" 307-redirects cookie-less requests (incl. Railway's health probe) to
# /login via the auth middleware — must probe a public 200 route instead.
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
